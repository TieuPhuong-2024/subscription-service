databaseChangeLog:
  - changeSet:
      id: 001-create-subscription-tables
      author: system
      changes:
        # Bảng subscription_plan
        - createTable:
            tableName: subscription_plan
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: price
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: duration
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: features
                  type: text
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        # Bảng subscription
        - createTable:
            tableName: subscription
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: plan_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_subscription_plan
                    references: subscription_plan(id)
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: auto_renew
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        # Bảng payment
        - createTable:
            tableName: payment
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: subscription_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_payment_subscription
                    references: subscription(id)
              - column:
                  name: amount
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: payment_method
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: payment_status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_id
                  type: varchar(100)
              - column:
                  name: payment_date
                  type: timestamp
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        # Bảng subscription_history
        - createTable:
            tableName: subscription_history
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: subscription_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_history_subscription
                    references: subscription(id)
              - column:
                  name: action
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: previous_status
                  type: varchar(20)
              - column:
                  name: new_status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        # Tạo index
        - createIndex:
            indexName: idx_subscription_user_id
            tableName: subscription
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_subscription_status
            tableName: subscription
            columns:
              - column:
                  name: status

        - createIndex:
            indexName: idx_payment_status
            tableName: payment
            columns:
              - column:
                  name: payment_status

        - createIndex:
            indexName: idx_payment_transaction_id
            tableName: payment
            columns:
              - column:
                  name: transaction_id